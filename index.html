
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Note - 無限キャンバス手書きメモ帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            touch-action: none; /* ブラウザ標準のピンチズームやスワイプ戻りを無効化 */
            background-color: #f8fafc;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 上部ツールバーの開閉スライドアニメーション */
        #toolbar-wrapper {
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
        }
        #toolbar-wrapper.toolbar-hidden {
            transform: translate(-50%, -130%);
            opacity: 0;
            pointer-events: none;
        }
        /* メニュー開閉トグルピルのアニメーション */
        #menu-toggle-pill {
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, opacity 0.2s ease;
        }
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translate(-50%, 16px); }
            100% { opacity: 1; transform: translate(-50%, 0); }
        }
        .toast-enter {
            animation: slideUpFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="relative text-slate-800">

    <!-- メイン描画キャンバス -->
    <canvas id="canvas"></canvas>

    <!-- 上部ツールバー開閉トグルボタン（メニュー収納時にも常にアクセス可能） -->
    <button id="menu-toggle-pill" class="fixed top-2.5 right-3 z-40 flex items-center gap-1.5 bg-white/90 hover:bg-white backdrop-blur-md shadow-md shadow-slate-900/10 border border-slate-200/90 rounded-full px-3 py-1.5 text-xs font-semibold text-slate-700 active:scale-95" title="ツールバーの表示 / 非表示 (M)">
        <i id="menu-toggle-icon" data-lucide="chevron-up" class="w-4 h-4 text-blue-600"></i>
        <span id="menu-toggle-label" class="hidden sm:inline">メニュー隠す</span>
    </button>

    <!-- 上部フローティングツールバー -->
    <header id="toolbar-wrapper" class="fixed top-3 left-1/2 -translate-x-1/2 z-30 max-w-[94vw] sm:max-w-[90vw]">
        <div class="flex items-center gap-1 sm:gap-1.5 bg-white/95 backdrop-blur-md shadow-lg shadow-slate-900/10 border border-slate-200/80 rounded-2xl p-1.5 overflow-x-auto no-scrollbar">
            
            <!-- ツール切り替えグループ -->
            <div class="flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl shrink-0">
                <button id="tool-pen" data-tool="pen" class="tool-btn flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition-all bg-blue-600 text-white shadow-sm" title="ペン (P)">
                    <i data-lucide="pen-tool" class="w-4 h-4"></i>
                    <span class="hidden md:inline">ペン</span>
                </button>
                <button id="tool-eraser" data-tool="eraser" class="tool-btn flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-white/80 transition-all" title="線消しゴム (E)">
                    <i data-lucide="eraser" class="w-4 h-4"></i>
                    <span class="hidden md:inline">線消し</span>
                </button>
                <button id="tool-lasso" data-tool="lasso" class="tool-btn flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-white/80 transition-all" title="投げ縄選択 (L)">
                    <i data-lucide="lasso" class="w-4 h-4"></i>
                    <span class="hidden md:inline">範囲選択</span>
                </button>
                <button id="tool-pan" data-tool="pan" class="tool-btn flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-white/80 transition-all" title="手のひら移動 (H / Space)">
                    <i data-lucide="hand" class="w-4 h-4"></i>
                    <span class="hidden md:inline">移動</span>
                </button>
            </div>

            <div class="h-6 w-px bg-slate-200 mx-0.5 shrink-0"></div>

            <!-- ペンの色＆太さ設定 -->
            <div id="pen-options" class="flex items-center gap-1.5 px-1 shrink-0">
                <div class="flex items-center gap-1" id="color-palette">
                    <button data-color="#1e293b" class="color-btn w-6 h-6 rounded-full bg-slate-800 ring-2 ring-offset-2 ring-blue-500 transition-transform scale-110" title="ブラック"></button>
                    <button data-color="#ef4444" class="color-btn w-6 h-6 rounded-full bg-red-500 hover:scale-110 transition-transform" title="レッド"></button>
                    <button data-color="#2563eb" class="color-btn w-6 h-6 rounded-full bg-blue-600 hover:scale-110 transition-transform" title="ブルー"></button>
                    <button data-color="#16a34a" class="color-btn w-6 h-6 rounded-full bg-green-600 hover:scale-110 transition-transform" title="グリーン"></button>
                    <button data-color="#f59e0b" class="color-btn w-6 h-6 rounded-full bg-amber-500 hover:scale-110 transition-transform" title="オレンジ"></button>
                </div>
                <label class="relative w-6 h-6 rounded-full overflow-hidden border border-slate-300 cursor-pointer flex items-center justify-center bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-500 hover:scale-110 transition-transform" title="カスタムカラー">
                    <input type="color" id="custom-color-input" value="#1e293b" class="opacity-0 absolute inset-0 w-full h-full cursor-pointer">
                </label>

                <div class="h-5 w-px bg-slate-200 mx-0.5"></div>

                <!-- 線の太さ -->
                <div class="flex items-center gap-1 bg-slate-100/80 p-1 rounded-xl" id="size-palette">
                    <button data-size="2" class="size-btn w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white transition-all" title="細字 (2px)">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-700"></span>
                    </button>
                    <button data-size="4" class="size-btn w-7 h-7 rounded-lg flex items-center justify-center bg-white shadow-sm transition-all" title="中字 (4px)">
                        <span class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
                    </button>
                    <button data-size="8" class="size-btn w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white transition-all" title="太字 (8px)">
                        <span class="w-4 h-4 rounded-full bg-slate-700"></span>
                    </button>
                </div>
            </div>

            <div class="h-6 w-px bg-slate-200 mx-0.5 shrink-0"></div>

            <!-- 元に戻す・やり直し -->
            <div class="flex items-center gap-1 shrink-0">
                <button id="btn-undo" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 disabled:opacity-35 disabled:pointer-events-none transition-colors" title="元に戻す (Ctrl+Z)">
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                </button>
                <button id="btn-redo" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 disabled:opacity-35 disabled:pointer-events-none transition-colors" title="やり直し (Ctrl+Y)">
                    <i data-lucide="redo-2" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="h-6 w-px bg-slate-200 mx-0.5 shrink-0"></div>

            <!-- 背景スタイル・オートハイド切替・保存管理メニュー -->
            <div class="flex items-center gap-1 shrink-0">
                <button id="btn-bg-toggle" class="p-2 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors" title="背景パターン切替（方眼 / ドット / 無地）">
                    <i data-lucide="grid" class="w-4 h-4"></i>
                </button>
                <button id="btn-autohide-toggle" class="p-2 rounded-xl text-blue-600 bg-blue-50 hover:bg-blue-100 transition-colors" title="描画中にメニューを自動で隠す：ON">
                    <i data-lucide="eye-off" class="w-4 h-4"></i>
                </button>
                <button id="btn-menu" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-slate-700 hover:bg-slate-100 font-medium text-sm transition-colors" title="保存・書き出し・設定">
                    <i data-lucide="folder-down" class="w-4 h-4 text-blue-600"></i>
                    <span class="hidden sm:inline">保存/管理</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 選択範囲のフローティングアクションバー（選択中のみ表示） -->
    <div id="selection-toolbar" class="hidden fixed z-30 bg-slate-900/95 text-white backdrop-blur-md shadow-xl rounded-2xl px-2.5 py-1.5 flex items-center gap-1.5 border border-slate-700/80 transition-opacity">
        <span id="selection-count" class="text-xs font-medium text-slate-300 px-1.5">0本の線</span>
        <div class="h-4 w-px bg-slate-700"></div>
        <button data-sel-color="#1e293b" class="sel-color-btn w-5 h-5 rounded-full bg-slate-700 border border-white/40 hover:scale-110 transition-transform" title="黒に変更"></button>
        <button data-sel-color="#ef4444" class="sel-color-btn w-5 h-5 rounded-full bg-red-500 border border-white/40 hover:scale-110 transition-transform" title="赤に変更"></button>
        <button data-sel-color="#2563eb" class="sel-color-btn w-5 h-5 rounded-full bg-blue-500 border border-white/40 hover:scale-110 transition-transform" title="青に変更"></button>
        <button data-sel-color="#16a34a" class="sel-color-btn w-5 h-5 rounded-full bg-green-500 border border-white/40 hover:scale-110 transition-transform" title="緑に変更"></button>
        <div class="h-4 w-px bg-slate-700 mx-0.5"></div>
        <button id="btn-duplicate-selection" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium transition-colors" title="複製">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
            <span>複製</span>
        </button>
        <button id="btn-delete-selection" class="flex items-center gap-1 px-2.5 py-1.5 rounded-xl bg-red-600 hover:bg-red-500 text-xs font-medium transition-colors" title="選択範囲を一括削除 (Delete)">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>一括削除</span>
        </button>
    </div>

    <!-- 右下ズームコントロール＆控えめな保存ステータス -->
    <div class="fixed bottom-3 right-3 z-30 flex flex-col items-end gap-1.5">
        <!-- 控えめな保存ステータスバッジ -->
        <div id="save-status" class="flex items-center gap-1.5 bg-white/80 backdrop-blur-sm border border-slate-200/60 rounded-full px-2.5 py-0.5 text-[11px] text-slate-400 transition-opacity">
            <span id="save-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span id="save-text">保存完了</span>
        </div>

        <!-- ズーム操作パネル -->
        <div class="flex items-center gap-0.5 bg-white/90 backdrop-blur-md shadow-md shadow-slate-900/10 border border-slate-200/80 rounded-2xl p-1">
            <button id="btn-zoom-out" class="p-1.5 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors" title="縮小">
                <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
            <button id="btn-zoom-reset" class="px-2 py-1 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 min-w-[3.2rem] text-center transition-colors" title="100%・初期位置にリセット">
                100%
            </button>
            <button id="btn-zoom-in" class="p-1.5 rounded-xl text-slate-600 hover:bg-slate-100 transition-colors" title="拡大">
                <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- 保存・データ管理モーダル -->
    <div id="menu-modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="database" class="w-5 h-5 text-blue-600"></i>
                    メモの保存・データ管理
                </h2>
                <button id="close-menu-modal" class="p-1.5 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div class="bg-emerald-50/80 border border-emerald-200/70 rounded-2xl p-3.5 text-xs text-emerald-900 leading-relaxed space-y-1">
                    <div class="font-semibold flex items-center gap-1.5">
                        <i data-lucide="hard-drive" class="w-4 h-4 text-emerald-600"></i>
                        大容量ストレージ（IndexedDB）で自動保存中
                    </div>
                    <p class="text-emerald-800">
                        描画データは自動的に座標圧縮されたうえでブラウザの大容量領域に保存されます。現在 <strong id="stats-stroke-count">0</strong> 本の線（約 <strong id="stats-data-size">0 KB</strong>）を保存しています。
                    </p>
                </div>

                <!-- オートハイド設定スイッチ -->
                <div class="flex items-center justify-between px-4 py-3 rounded-2xl border border-slate-200 bg-slate-50/60">
                    <div>
                        <div class="text-sm font-semibold text-slate-800">描画中はメニューを自動で隠す</div>
                        <div class="text-xs text-slate-500">ペンや指で描き始めると上部バーを収納します</div>
                    </div>
                    <input type="checkbox" id="checkbox-autohide" checked class="w-5 h-5 accent-blue-600 rounded cursor-pointer">
                </div>

                <div class="space-y-2.5">
                    <button id="btn-export-png" class="w-full flex items-center justify-between px-4 py-3 rounded-2xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition-all text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                                <i data-lucide="image" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold text-slate-800">画像として保存 (PNG)</div>
                                <div class="text-xs text-slate-500">描いた範囲全体を1枚の画像に出力します</div>
                            </div>
                        </div>
                        <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                    </button>

                    <button id="btn-export-json" class="w-full flex items-center justify-between px-4 py-3 rounded-2xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition-all text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center">
                                <i data-lucide="file-code" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold text-slate-800">バックアップ保存 (JSON)</div>
                                <div class="text-xs text-slate-500">再編集可能なデータファイルとして保存</div>
                            </div>
                        </div>
                        <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                    </button>

                    <label class="w-full flex items-center justify-between px-4 py-3 rounded-2xl border border-slate-200 hover:border-blue-400 hover:bg-blue-50/40 transition-all cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center">
                                <i data-lucide="upload" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold text-slate-800">バックアップから復元 (JSON)</div>
                                <div class="text-xs text-slate-500">保存したJSONファイルを読み込みます</div>
                            </div>
                        </div>
                        <i data-lucide="folder-open" class="w-4 h-4 text-slate-400"></i>
                        <input type="file" id="input-import-json" accept=".json" class="hidden">
                    </label>
                </div>

                <div class="pt-2 border-t border-slate-100">
                    <button id="btn-clear-canvas" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-2xl bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-sm transition-colors">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        キャンバスをすべて消去
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- カスタム確認ダイアログ -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-sm p-6 space-y-4">
            <div class="flex items-center gap-3 text-red-600">
                <div class="w-10 h-10 rounded-2xl bg-red-100 flex items-center justify-center shrink-0">
                    <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                </div>
                <h3 id="confirm-title" class="text-base font-bold text-slate-800">確認</h3>
            </div>
            <p id="confirm-message" class="text-sm text-slate-600 leading-relaxed">本当に実行しますか？</p>
            <div class="flex items-center justify-end gap-2 pt-2">
                <button id="confirm-cancel" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors">キャンセル</button>
                <button id="confirm-ok" class="px-4 py-2 rounded-xl text-sm font-semibold bg-red-600 hover:bg-red-700 text-white shadow-sm transition-colors">消去する</button>
            </div>
        </div>
    </div>

    <!-- 通知トースト -->
    <div id="toast" class="hidden fixed bottom-16 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg backdrop-blur-sm">
        メッセージ
    </div>

    <script>
        /**
         * Infinite Note - 無限キャンバス手書きメモ帳 (大容量IndexedDB & 自動収納UI対応版)
         */

        lucide.createIcons();

     // IndexedDB 設定（localStorageの5MB制限を回避し、数百MB〜数GBの保存に対応）
        const DB_NAME = 'InfiniteNoteDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'notebooks';
        const NOTE_ID = 'default_notebook';
        const LEGACY_STORAGE_KEY = 'infinite_note_data_v1';

        // DOM要素
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const toolbarWrapper = document.getElementById('toolbar-wrapper');
        const menuTogglePill = document.getElementById('menu-toggle-pill');
        const menuToggleIcon = document.getElementById('menu-toggle-icon');
        const menuToggleLabel = document.getElementById('menu-toggle-label');
        const selectionToolbar = document.getElementById('selection-toolbar');
        const selectionCountEl = document.getElementById('selection-count');
        const zoomResetBtn = document.getElementById('btn-zoom-reset');
        const saveDot = document.getElementById('save-dot');
        const saveText = document.getElementById('save-text');

        // アプリケーション状態
        const state = {
            strokes: [], // { id, points: [{x, y}], color, size, bbox: {minX, minY, maxX, maxY} }
            history: [],
            historyIndex: -1,
            camera: {
                x: 0,
                y: 0,
                zoom: 1
            },
            tool: 'pen', // 'pen' | 'eraser' | 'lasso' | 'pan'
            penColor: '#1e293b',
            penSize: 4,
            bgPattern: 'grid', // 'grid' | 'dots' | 'blank'

            // メニュー表示・収納状態
            isToolbarVisible: true,
            autoHideToolbar: true,
            wasAutoHiddenDuringStroke: false,

            // 描画・操作中の一時状態
            currentStroke: null,
            hoveredStrokeIds: new Set(),

            // 投げ縄・選択関連
            lassoPoints: [],
            selectedIds: new Set(),
            selectionBox: null,
            transformMode: null,
            transformStartWorld: null,
            transformInitialStrokes: null,
            transformInitialBox: null,

            // 自動スクロール状態
            lastScreenPointer: null,
            autoScrollVel: { x: 0, y: 0 },

            // マルチタッチ・ポインター管理
            activePointers: new Map(),
            isPinching: false,
            pinchStartDist: 0,
            pinchStartZoom: 1,
            pinchCenterWorld: null,
            panLastScreen: null,
            isSpacePressed: false
        };

        // ==========================================
        // 上部メニューの開閉・オートハイド制御
        // ==========================================
        function setToolbarVisibility(visible, isAuto = false) {
            state.isToolbarVisible = visible;
            if (visible) {
                toolbarWrapper.classList.remove('toolbar-hidden');
                menuToggleIcon.setAttribute('data-lucide', 'chevron-up');
                menuToggleLabel.textContent = 'メニュー隠す';
                menuTogglePill.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                menuTogglePill.classList.add('bg-white/90', 'text-slate-700', 'border-slate-200/90');
                menuToggleIcon.classList.remove('text-white');
                menuToggleIcon.classList.add('text-blue-600');
            } else {
                toolbarWrapper.classList.add('toolbar-hidden');
                menuToggleIcon.setAttribute('data-lucide', 'sliders-horizontal');
                menuToggleLabel.textContent = 'ツールを開く';
                menuTogglePill.classList.remove('bg-white/90', 'text-slate-700', 'border-slate-200/90');
                menuTogglePill.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                menuToggleIcon.classList.remove('text-blue-600');
                menuToggleIcon.classList.add('text-white');
            }
            lucide.createIcons();
            if (!isAuto) {
                state.wasAutoHiddenDuringStroke = false;
            }
        }

        menuTogglePill.addEventListener('click', () => {
            setToolbarVisibility(!state.isToolbarVisible, false);
        });

        function updateAutoHideUI() {
            const btn = document.getElementById('btn-autohide-toggle');
            const chk = document.getElementById('checkbox-autohide');
            chk.checked = state.autoHideToolbar;
            if (state.autoHideToolbar) {
                btn.className = 'p-2 rounded-xl text-blue-600 bg-blue-50 hover:bg-blue-100 transition-colors';
                btn.title = '描画中にメニューを自動で隠す：ON';
            } else {
                btn.className = 'p-2 rounded-xl text-slate-400 hover:bg-slate-100 transition-colors';
                btn.title = '描画中にメニューを自動で隠す：OFF';
            }
        }

        document.getElementById('btn-autohide-toggle').addEventListener('click', () => {
            state.autoHideToolbar = !state.autoHideToolbar;
            updateAutoHideUI();
            saveToIndexedDB();
            showToast(state.autoHideToolbar ? '描画中の自動収納：ON' : '描画中の自動収納：OFF');

        document.getElementById('checkbox-autohide').addEventListener('change', (e) => {
            state.autoHideToolbar = e.target.checked;
            updateAutoHideUI();
            saveToIndexedDB();
